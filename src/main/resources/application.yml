spring:
  sql:
    init:
      mode: always
  application:
    name: redisson-stock-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockdb}
    username: ${DB_USERNAME:stockuser}
    password: ${DB_PASSWORD:stockpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: 8080
